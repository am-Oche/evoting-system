<!DOCTYPE html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  </head>
  <body style="background-color: rgba(0, 0, 0, 0.4); font-family: 'Segoe UI Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden;">
    
    <!-- Windows 11 Security Popup -->
    <div style="background: #ffffff; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-radius: 8px; width: 440px; overflow: hidden; display: flex; flex-direction: column;">
      
      <!-- Content Area -->
      <div style="padding: 24px 24px 32px 24px;">
        
        <!-- App Title / Context -->
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
          <svg style="width: 16px; height: 16px; fill: #0067c0; margin-right: 8px;" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
          <span style="font-size: 12px; color: #555; font-weight: 600;">Windows Security</span>
        </div>

        <h2 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 600; color: #111;">Making sure it's you</h2>
        <p style="margin: 0 0 32px 0; font-size: 14px; color: #444; line-height: 1.4;">Please verify your identity to sign in to <strong>localhost</strong>.</p>
        
        <!-- Windows Hello Icon Group -->
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;">
          
          <!-- Google Material Fingerprint Icon -->
          <span class="material-icons" style="font-size: 80px; color: #0067c0; margin-bottom: 16px;">fingerprint</span>

          <span style="font-size: 15px; color: #111; font-weight: 500;">Touch the fingerprint sensor</span>
        </div>

      </div>

      <!-- Footer Buttons -->
      <div style="background: #fbfbfb; padding: 16px 24px; display: flex; justify-content: space-between; border-top: 1px solid #f0f0f0;">
        <button style="background: transparent; border: none; font-family: 'Segoe UI'; font-size: 14px; color: #0067c0; cursor: pointer; padding: 6px 12px; margin-left: -12px;">More choices</button>
        <button style="background: #fbfbfb; border: 1px solid #ccc; padding: 6px 24px; font-family: 'Segoe UI'; font-size: 14px; border-radius: 4px; color: #111; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">Cancel</button>
      </div>
    </div>
  </body>
</html>
